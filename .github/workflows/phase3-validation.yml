name: Phase 3 Validation

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  phase3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run Phase 3 consolidated validation
        run: |
          node --input-type=module -e "import('./src/phase3ProductionQualificationValidationRunner.js').then(async m => { const r = await m.runPhase3ProductionQualificationValidation(); console.log('PHASE3_RESULT_JSON', JSON.stringify(r)); process.exit(r.allAssertionsPassed ? 0 : 1); }).catch(err => { console.error('PHASE3_RUNTIME_ERROR', err); process.exit(1); })"
