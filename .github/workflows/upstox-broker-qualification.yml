name: Upstox Broker Qualification Gate

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Upstox Sandbox Lifecycle Qualification
    types:
      - completed

jobs:
  qualify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UPSTOX_ENVIRONMENT: SANDBOX
      PRODUCTION_REAL_TRADING_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Upstox integration validation
        run: node src/upstox/upstoxIntegrationValidationRunner.js
      - name: Build release candidate
        run: npm run build
      - name: Enforce production safety gate
        shell: bash
        run: |
          test "$UPSTOX_ENVIRONMENT" = "SANDBOX"
          test "$PRODUCTION_REAL_TRADING_ENABLED" != "true"
          echo "UPSTOX_BROKER_QUALIFICATION=PASSED"
          echo "PAPER_ONLY=true"
          echo "REAL_ORDER_PLACED=false"
          echo "PRODUCTION_REAL_TRADING_ENABLED=false"
