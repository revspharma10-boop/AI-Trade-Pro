name: Production Qualification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node -e "import('./src/phase3ProductionQualificationValidationRunner.js').then(async m => process.exit((await m.runPhase3ProductionQualificationValidation()).allAssertionsPassed ? 0 : 1))"
      - run: npm run test:production-qualification
      - run: npm run build
