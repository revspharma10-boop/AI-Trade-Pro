name: Intraday Recommendation Safety Qualification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node src/intradayRecommendationQualificationRunner.js
      - run: node src/intradayPaperSignalQualificationRunner.js
      - run: node src/intradayPaperTradePlanQualificationRunner.js
      - run: node src/autoOptionResearchQualificationRunner.js
      - run: node src/indexDemoJournalQualificationRunner.js
      - run: node --check src/indexDemoSessionUI.js
      - run: node src/autoOptionBackendQualificationRunner.js
      - run: node src/mcxAutoOptionResearchQualificationRunner.js
      - run: node src/mcxWaitDiagnosticsQualificationRunner.js
      - run: node --check src/autoOptionResearchUI.js
      - run: node --check src/services/intradayPaperTradePlan.js
      - run: node --check src/services/intradayPaperSignalEngine.js
      - run: node src/intradayInstrumentQualificationRunner.js
      - run: node src/intradayTechnicalQualificationRunner.js
      - run: node src/intradayPerformanceQualificationRunner.js
      - run: node src/commodityIntradayQualificationRunner.js
      - run: node src/commodityReadOnlyBackendQualificationRunner.js
      - run: node src/upstoxAnalyticsTokenQualificationRunner.js
      - run: node src/intradaySanityDiagnosticQualificationRunner.js
      - run: node --check src/services/intradayMarketClock.js
      - run: node --check src/services/intradayRiskEngine.js
      - run: node --check server/upstoxOAuthCallbackServer.js
      - run: node --check src/intradayRecommendationsUI.js
      - run: npm run build
