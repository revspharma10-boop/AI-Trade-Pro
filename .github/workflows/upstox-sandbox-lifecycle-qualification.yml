name: Upstox Sandbox Lifecycle Qualification

on:
  workflow_dispatch:
  push:
    paths:
      - src/upstox/upstoxSandboxLifecycleQualificationRunner.js
      - .github/workflows/upstox-sandbox-lifecycle-qualification.yml

jobs:
  sandbox-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UPSTOX_ENVIRONMENT: SANDBOX
      PRODUCTION_REAL_TRADING_ENABLED: "false"
      UPSTOX_SANDBOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_SANDBOX_ACCESS_TOKEN }}
      UPSTOX_SANDBOX_TEST_INSTRUMENT: ${{ vars.UPSTOX_SANDBOX_TEST_INSTRUMENT }}
      UPSTOX_SANDBOX_TEST_PRICE: ${{ vars.UPSTOX_SANDBOX_TEST_PRICE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate sandbox secret
        shell: bash
        run: test -n "$UPSTOX_SANDBOX_ACCESS_TOKEN"
      - name: Run sandbox lifecycle qualification
        run: node src/upstox/upstoxSandboxLifecycleQualificationRunner.js
      - name: Assert production remains disabled
        shell: bash
        run: |
          test "$UPSTOX_ENVIRONMENT" = "SANDBOX"
          test "$PRODUCTION_REAL_TRADING_ENABLED" != "true"
          echo "PAPER_ONLY=true"
          echo "REAL_ORDER_PLACED=false"
          echo "PRODUCTION_REAL_TRADING_ENABLED=false"
