name: Full System Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run full-system integration
        run: |
          node --input-type=module <<'NODE'
          import { runFullSystemIntegrationValidation } from './src/fullSystemIntegrationValidationRunner.js';
          const result = await runFullSystemIntegrationValidation();
          console.log('FULL_SYSTEM_RESULT_JSON=' + JSON.stringify(result));
          if (!result.allAssertionsPassed) process.exit(1);
          NODE
      - name: Build application
        run: npm run build
