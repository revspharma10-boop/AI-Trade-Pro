name: Upgrade Free Dashboard Passwords
on:
  push:
    branches:
      - deploy/algo-trader-paper-free-v1
    paths:
      - dashboard-auth-upgrade.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: algo-dashboard-free-upgrade
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply tested password update
        run: |
          python -m zipfile -e algo-trader-dashboard-free.zip .
          python dashboard-auth-upgrade.py
          python -m pip install -r algo-trader-dashboard-free/requirements.txt
          cd algo-trader-dashboard-free
          python -m unittest discover -s tests -q
          node --check static/app.js
      - name: Repackage updated application
        run: |
          python - <<'PY'
          import pathlib,zipfile
          root=pathlib.Path('algo-trader-dashboard-free')
          with zipfile.ZipFile('algo-trader-dashboard-free.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file() and '__pycache__' not in p.parts and p.suffix not in ('.pyc','.sqlite3'):
                      z.write(p,str(p))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add algo-trader-dashboard-free.zip
          git diff --cached --quiet || (git commit -m "Deploy tested dashboard password management" && git push)
