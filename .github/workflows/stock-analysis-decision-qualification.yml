name: Stock Analysis Decision Qualification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/services/stockAnalysisDecisionEngine.js'
      - 'src/services/recommendationEngine.js'
      - 'src/stockAnalysisDecisionQualificationRunner.js'
      - '.github/workflows/stock-analysis-decision-qualification.yml'
jobs:
  qualify:
    runs-on: ubuntu-24.04
    env:
      PAPER_ONLY: "true"
      REAL_ORDER_PLACED: "false"
      PRODUCTION_REAL_TRADING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/stockAnalysisDecisionQualificationRunner.js
      - run: npm run build
