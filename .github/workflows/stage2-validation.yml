name: Stage 2 Real-Time Paper Qualification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI uses Node 22 and v5 GitHub Actions to avoid the deprecated Node 20 action runtime.
# Keep this workflow paper-only; validation failure must stop the job.
jobs:
  stage2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Stage 2 validation
        run: |
          node --input-type=module <<'NODE'
          import { runStage2RealTimePaperQualificationValidation } from './src/stage2RealTimePaperQualificationValidationRunner.js';
          const result = runStage2RealTimePaperQualificationValidation();
          console.log('STAGE2_RESULT_JSON=' + JSON.stringify(result));
          if (!result.allAssertionsPassed) process.exit(1);
          NODE
      - name: Production build
        run: npm run build
