name: Upstox Production Connectivity Verification

on:
  workflow_dispatch:

jobs:
  verify-read-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PAPER_ONLY: "true"
      REAL_ORDER_PLACED: "false"
      PRODUCTION_REAL_TRADING_ENABLED: "false"
      UPSTOX_PRODUCTION_ACCESS_TOKEN: ${{ secrets.UPSTOX_PRODUCTION_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Require production credential
        shell: bash
        run: |
          test -n "$UPSTOX_PRODUCTION_ACCESS_TOKEN"
      - name: Run authenticated read-only production verification
        run: node src/upstox/upstoxProductionConnectivityValidationRunner.js
      - name: Reassert no-order safety boundary
        shell: bash
        run: |
          test "$PAPER_ONLY" = "true"
          test "$REAL_ORDER_PLACED" = "false"
          test "$PRODUCTION_REAL_TRADING_ENABLED" = "false"
          echo "UPSTOX_PRODUCTION_CONNECTIVITY_VERIFICATION=PASSED"
          echo "REAL_ORDER_PLACED=false"
          echo "PRODUCTION_REAL_TRADING_ENABLED=false"
